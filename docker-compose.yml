services:
  mysql:
    image: mysql:8
    container_name: locadora-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: locadora
    ports:
      - "3306:3306"
    volumes:
      - locadora-dados:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  locadora-dados:
